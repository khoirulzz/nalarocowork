<!doctype html>
<html lang="id"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#e9e5d8"/><meta name="description" content="Nalaro Cowork, kantor virtual 3D."/><title>Nalaro Cowork</title></head>
<body><div id="app">
 <main id="stage" class="stage" aria-label="Kantor virtual"><div id="viewport" class="viewport"></div></main>
 <header class="office-brand"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M5 23V5h5l8 12V5h5v18h-5L10 11v12Z" fill="currentColor"/></svg><span>Nalaro Cowork</span></header>
 <nav class="toolbar" aria-label="Kontrol kantor">
  <button data-panel="people" data-icon="people" aria-label="Karyawan" title="Karyawan" aria-haspopup="dialog"></button>
  <button data-panel="command" data-icon="command" aria-label="Perintah" title="Perintah" aria-haspopup="dialog"></button>
  <button data-panel="objects" data-icon="objects" aria-label="Objek" title="Objek" aria-haspopup="dialog"></button>
  <button data-panel="history" data-icon="history" aria-label="Riwayat" title="Riwayat" aria-haspopup="dialog"></button>
  <span class="tool-divider"></span>
  <button data-panel="settings" data-icon="settings" aria-label="Pengaturan" title="Pengaturan" aria-haspopup="dialog"></button>
 </nav>
 <div class="camera-tools" role="group" aria-label="Kamera">
  <button id="zoom-out" data-icon="minus" aria-label="Perkecil" title="Perkecil"></button><output id="zoom-value" aria-label="Zoom">100%</output>
  <button id="zoom-in" data-icon="plus" aria-label="Perbesar" title="Perbesar"></button><span class="tool-divider"></span>
  <button id="reset-camera" data-icon="reset" aria-label="Atur ulang kamera" title="Atur ulang kamera"></button>
 </div>
 <p id="notice" class="notice" role="status" hidden></p>
 <dialog id="office-panel" class="office-panel" aria-labelledby="panel-title">
  <header class="panel-head"><h1 id="panel-title">Karyawan</h1><button id="close-panel" data-icon="close" aria-label="Tutup panel"></button></header>
  <section id="panel-people" class="panel-body" hidden>
   <label class="search-field"><span class="sr-only">Cari karyawan</span><input id="people-search" type="search" placeholder="Cari karyawan"/></label>
   <div id="people-list" class="people-list"></div><div id="selected-employee" class="selected-employee"></div>
  </section>
  <section id="panel-command" class="panel-body" hidden>
   <form id="command-form"><label for="command-input">Perintah</label><textarea id="command-input" rows="5" maxlength="1500" placeholder="@ulum datangi siswo dan suruh dia push up"></textarea>
    <div class="form-footer"><span id="command-mode">Lokal</span><button id="send-command" class="primary" type="submit">Kirim</button></div>
   </form><p id="command-error" class="error" role="alert" hidden></p>
  </section>
  <section id="panel-objects" class="panel-body" hidden><label class="search-field"><span class="sr-only">Cari objek</span><input id="object-search" type="search" placeholder="Cari objek"/></label><div id="object-list"></div></section>
  <section id="panel-history" class="panel-body" hidden><div class="history-head"><button id="clear-log" class="text-button">Hapus riwayat</button></div><div id="activity-log" role="log"></div></section>
  <section id="panel-settings" class="panel-body" hidden>
   <div class="setting-row"><label for="graphics">Grafis</label><select id="graphics"><option value="1.3">Otomatis</option><option value="0.85">Hemat</option><option value="1.8">Detail</option></select></div>
   <div class="setting-row"><label for="show-names">Semua nama</label><input id="show-names" type="checkbox"/></div>
   <div class="setting-row"><label for="show-upper">Lantai atas</label><input id="show-upper" type="checkbox" checked/></div>
   <div class="setting-row"><label for="pause-sim">Jeda simulasi</label><input id="pause-sim" type="checkbox"/></div>
   <div class="setting-row"><span>Groq</span><span id="connection-status">Memeriksa</span></div>
   <div class="setting-row"><span>Frame rate</span><output id="scene-fps">—</output></div>
   <p class="camera-help">Scroll atau cubit untuk zoom. Geser untuk memutar. Klik kanan dan geser untuk menggeser kamera.</p>
  </section>
 </dialog>
</div><script type="module" src="/src/main.js"></script></body></html>
