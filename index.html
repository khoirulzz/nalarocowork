<!doctype html>
<html lang="id"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#f6f7f6"/><meta name="description" content="Nalaro Cowork — kantor virtual 3D."/>
<title>Nalaro Cowork</title>
</head><body>
<div id="app">
<header class="topbar">
 <div class="topbrand"><div class="n-mark" aria-hidden="true">N</div><strong>Nalaro Cowork</strong></div>
 <div class="toptools"><span id="connection-status">Offline</span><span class="separator"></span>
 <span id="scene-fps" aria-label="Frame rate">— FPS</span>
 <button id="quality-btn" class="plain-top" type="button">Grafis: Auto</button></div>
</header>
<div class="layout" id="layout">
<aside id="people-pane" class="people-pane" aria-label="Daftar karyawan">
 <div class="pane-top"><h2>Karyawan</h2><button id="toggle-people" class="icon-btn" aria-label="Tutup panel karyawan" title="Sembunyikan karyawan">‹</button></div>
 <div class="people-content">
 <div class="filter"><input id="people-search" type="search" placeholder="Cari" aria-label="Cari karyawan"/></div>
 <div class="people-list" id="people-list"></div>
 </div>
</aside>
<main class="stage" aria-label="Simulasi kantor 3D">
 <div id="viewport" class="viewport"></div>
 <button id="reset-camera" class="camera-reset" title="Reset kamera" aria-label="Reset kamera">↺</button>
</main>
<aside id="command-pane" class="command-pane" aria-label="Panel pemilik">
 <div class="pane-top"><h2>Owner</h2><button id="toggle-command" class="icon-btn" aria-label="Tutup panel owner" title="Sembunyikan panel owner">›</button></div>
 <div class="owner-content">
  <div id="selected-employee" class="selected-employee"></div>
  <div class="command-section">
   <div class="command-header"><h3>Perintah</h3><button type="button" class="link-btn" id="open-objects">Objek</button></div>
   <form id="command-form">
    <textarea id="command-input" rows="4" placeholder="Ketik perintah, misalnya @fadil samperin lukman" aria-label="Perintah untuk karyawan"></textarea>
    <div class="input-actions"><span>Ctrl + Enter</span><button id="send-command" type="submit">Kirim ↗</button></div>
   </form>
  </div>
  <div class="owner-bottom"><span id="command-mode">Perintah lokal</span><button id="open-activity" class="history-btn" type="button">Riwayat <span id="activity-count"></span></button></div>
 </div>
 <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>
 <section id="sidebar-drawer" class="sidebar-drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
  <header class="drawer-head"><h3 id="drawer-title">Riwayat</h3><button id="close-drawer" class="icon-btn" aria-label="Tutup">×</button></header>
  <div class="drawer-tools"><button id="clear-log" class="link-btn">Bersihkan</button></div>
  <div id="activity-log" class="activity-log" aria-live="polite"></div>
  <div id="object-browser" class="object-browser" hidden><input type="search" id="object-search" placeholder="Cari benda" aria-label="Cari benda"/><div id="object-list"></div></div>
 </section>
</aside>
</div></div>
<script type="module" src="/src/main.js"></script>
</body></html>
